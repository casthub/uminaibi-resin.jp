# 中身を出す部分（HTTP・HTTPS 共通）。サイトのファイルは /opt/uminaibi-resin/site
root /opt/uminaibi-resin/site;
index index.html;
charset utf-8;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location / {
    # /concept でも /concept.html でも開けるように
    try_files $uri $uri.html $uri/ =404;
}

# 画像・CSS・JS は1日キャッシュ（ファイル名を変えずに差し替えることがあるので短め）
location ~* \.(css|js|jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
    expires 1d;
    access_log off;
}

# 隠しファイル（.git など）は出さない
location ~ /\. { deny all; }
