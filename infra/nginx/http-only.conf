# uminaibi-resin.jp（証明書を取る前の形。HTTP のみ）
#   /opt/uminaibi-resin/bin/enable-https.sh が、証明書を取ったあと https.conf に差し替える。
#   ★R-ENTRY とは別のサイト。R-ENTRY のファイル（snippets/r-entry-*.conf）は読み込まない。
server {
    listen 80;
    listen [::]:80;
    server_name uminaibi-resin.jp www.uminaibi-resin.jp;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    include /opt/uminaibi-resin/infra/nginx/site-common.conf;
}
