# uminaibi-resin.jp（証明書を取ったあとの形）
#   ★R-ENTRY とは別のサイト。R-ENTRY のファイル（snippets/r-entry-*.conf）は読み込まない。
server {
    listen 80;
    listen [::]:80;
    server_name uminaibi-resin.jp www.uminaibi-resin.jp;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://uminaibi-resin.jp$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/3。受け口そのものは /etc/nginx/sites-enabled/00-default.conf が作る
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name uminaibi-resin.jp www.uminaibi-resin.jp;

    ssl_certificate     /etc/letsencrypt/live/uminaibi-resin.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uminaibi-resin.jp/privkey.pem;

    # www 付きで来たら www なしへ
    if ($host = www.uminaibi-resin.jp) { return 301 https://uminaibi-resin.jp$request_uri; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    include /opt/uminaibi-resin/infra/nginx/site-common.conf;
}
